# Publish to npm with provenance, on a version tag.
#
# Provenance is the reason this runs in Actions rather than on a laptop: npm
# records a signed, verifiable link between the published tarball and the exact
# commit and workflow that produced it, and shows a "Provenance" panel on the
# package page. That attestation can only be generated by a trusted CI system
# with an OIDC identity, which is what `id-token: write` below grants.
#
# Release flow:
#
#   1. bump "version" in package.json, and add the release to CHANGELOG.md
#   2. commit and push to main
#   3. git tag v1.0.1 && git push --tags
#
# The tag is what triggers this. Pushing to main never publishes.
#
# REQUIRED SECRET: NPM_TOKEN, at Settings -> Secrets and variables -> Actions.
#
# The token has to be one that can publish without a human present. A Publish
# token fails here the moment the account has 2FA on publishes, because there
# is nobody to type a one-time code. Two kinds work:
#
#   Granular access token   the current npm default, and the better choice.
#                           Permissions -> Packages and scopes -> Read and
#                           write. It expires, and when it does this workflow
#                           fails with what looks like an auth bug, so note
#                           the date somewhere you will see it.
#
#   Classic Automation      the legacy equivalent. Does not expire. Still
#                           works; npm is steering away from it.
#
# THE FIRST PUBLISH OF A NEW PACKAGE NEEDS "All packages". A granular token
# scoped to selected packages cannot create a package that does not exist yet
# — there is nothing in the list to select — and the failure reads as a 404 or
# a 403 rather than as a scoping problem. Narrow the token to the one package
# after the first release, if you want.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for provenance; without it publish still works but unsigned

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm versions cannot be reused. Cheapest
      # possible guard against the most annoying possible mistake.
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Same gate as build.yml. `prepack` would run this anyway, but running it
      # explicitly means a contrast failure is reported as its own red step
      # rather than buried in npm's output.
      - name: Measure, check and render
        run: node build.js

      - name: Refuse to publish a version that already exists
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published — bump the version"
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`$name@$version\`"
            echo
            echo "- https://www.npmjs.com/package/$name/v/$version"
            echo "- Provenance is attested to commit \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
