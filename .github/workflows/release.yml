# Publish to npm with provenance, on a version tag.
#
# Provenance is the reason this runs in Actions rather than on a laptop: npm
# records a signed, verifiable link between the published tarball and the exact
# commit and workflow that produced it, and shows a "Provenance" panel on the
# package page. That attestation can only be generated by a trusted CI system
# with an OIDC identity, which is what `id-token: write` below grants.
#
# Release flow:
#
#   1. bump "version" in package.json, and add the release to CHANGELOG.md
#   2. commit and push to main
#   3. git tag v1.0.1 && git push --tags
#
# The tag is what triggers this. Pushing to main never publishes.
#
# NO SECRET REQUIRED. This publishes by OpenID Connect — npm trusts this
# repository and this workflow filename directly, and mints a short-lived
# credential for the duration of the run. There is no token to store, rotate,
# leak or let expire.
#
# The trust is configured on the package, not here: npmjs.com -> chapbook ->
# Settings -> Trusted Publisher -> GitHub Actions, naming the org, the repo and
# THIS FILENAME. Rename this file and publishing stops until the connection is
# updated to match.
#
# `Allow npm publish` is enabled on that connection, so a tag publishes on its
# own. The stricter alternative is to leave it off, which limits this workflow
# to `npm stage publish` and requires a human to promote the release from npm's
# Staged Packages page.
#
# WHY NOT A TOKEN. It is not only that OIDC is tidier. No token npm still
# issues could have done the first publish of this package at all: classic
# tokens are gone from both the website and the CLI, and a granular token
# resolves "all packages" to packages you already own, so it cannot create a
# new unscoped name. chapbook@0.0.0 was published by hand to create the
# package; every release since has come through this workflow. npm is also
# retiring direct token publishing in January 2027.


name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Not an optional extra any more. Under trusted publishing this IS the
  # credential: without it there is nothing to authenticate with and the
  # publish fails outright, rather than merely publishing unsigned.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and node 22 ships npm 10.
      # Without this the publish falls back to looking for a token, finds none,
      # and fails with an authentication error that says nothing about the
      # version being the real cause.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm versions cannot be reused. Cheapest
      # possible guard against the most annoying possible mistake.
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Same gate as build.yml. `prepack` would run this anyway, but running it
      # explicitly means a contrast failure is reported as its own red step
      # rather than buried in npm's output.
      - name: Measure, check and render
        run: node build.js

      - name: Refuse to publish a version that already exists
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published — bump the version"
            exit 1
          fi

      # --provenance is not passed: trusted publishing attaches provenance on
      # its own, and passing the flag as well is redundant at best.
      - name: Publish with provenance
        run: npm publish --access public

      - name: Summary
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`$name@$version\`"
            echo
            echo "- https://www.npmjs.com/package/$name/v/$version"
            echo "- Provenance is attested to commit \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
