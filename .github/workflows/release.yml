# Publish to npm with provenance, on a version tag.
#
# Provenance is the reason this runs in Actions rather than on a laptop: npm
# records a signed, verifiable link between the published tarball and the exact
# commit and workflow that produced it, and shows a "Provenance" panel on the
# package page. That attestation can only be generated by a trusted CI system
# with an OIDC identity, which is what `id-token: write` below grants.
#
# Release flow:
#
#   1. bump "version" in package.json, and add the release to CHANGELOG.md
#   2. commit and push to main
#   3. git tag -a v1.0.1 -m "..." && git push origin v1.0.1
#
# The tag is what triggers this. Pushing to main never publishes.
#
# ANNOTATED, not lightweight. The tag's message becomes the GitHub Release
# notes verbatim, so the reasoning is written once and cannot drift between
# the two. A lightweight tag would publish the package and then open a Release
# with nothing in it.
#
# NO SECRET REQUIRED. This publishes by OpenID Connect — npm trusts this
# repository and this workflow filename directly, and mints a short-lived
# credential for the duration of the run. There is no token to store, rotate,
# leak or let expire.
#
# The trust is configured on the package, not here: npmjs.com -> chapbook ->
# Settings -> Trusted Publisher -> GitHub Actions, naming the org, the repo and
# THIS FILENAME. Rename this file and publishing stops until the connection is
# updated to match.
#
# `Allow npm publish` is enabled on that connection, so a tag publishes on its
# own. The stricter alternative is to leave it off, which limits this workflow
# to `npm stage publish` and requires a human to promote the release from npm's
# Staged Packages page.
#
# WHY NOT A TOKEN. It is not only that OIDC is tidier. No token npm still
# issues could have done the first publish of this package at all: classic
# tokens are gone from both the website and the CLI, and a granular token
# resolves "all packages" to packages you already own, so it cannot create a
# new unscoped name. chapbook@0.0.0 was published by hand to create the
# package; every release since has come through this workflow. npm is also
# retiring direct token publishing in January 2027.


name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # Write, and only for the release step below. The tag already exists by the
  # time this runs — nothing here pushes code — so the elevation buys exactly
  # one thing: the GitHub Release object that `git push --tags` does not make.
  contents: write
  # Not an optional extra any more. Under trusted publishing this IS the
  # credential: without it there is nothing to authenticate with and the
  # publish fails outright, rather than merely publishing unsigned.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so build.js's freeze guard can see that this version is
          # published and refuse to rewrite it. Without them it fails open
          # on the one path where rewriting a release actually matters.
          fetch-depth: 0

      # v7 matters here rather than being merely current: it removed the dummy
      # NODE_AUTH_TOKEN export that earlier versions wrote into .npmrc. That
      # placeholder points at an environment variable this workflow no longer
      # sets, which is the classic way an OIDC publish fails with an auth error
      # that has nothing to do with OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and node 22 ships npm 10.
      # Without this the publish falls back to looking for a token, finds none,
      # and fails with an authentication error that says nothing about the
      # version being the real cause.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm versions cannot be reused. Cheapest
      # possible guard against the most annoying possible mistake.
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Same gate as build.yml. `prepack` would run this anyway, but running it
      # explicitly means a contrast failure is reported as its own red step
      # rather than buried in npm's output.
      - name: Measure, check and render
        run: node build.js

      - name: Refuse to publish a version that already exists
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published — bump the version"
            exit 1
          fi

      # --provenance is not passed: trusted publishing attaches provenance on
      # its own, and passing the flag as well is redundant at best.
      - name: Publish with provenance
        run: npm publish --access public

      # A tag is not a release. `git push --tags` creates a ref and nothing else,
      # so for three versions this repository had tags, published packages, a
      # deployed site — and an empty Releases page, because the only Release
      # that existed had been made by hand and still claimed to be the latest.
      #
      # AFTER the publish, deliberately. A Release announcing a version that
      # failed to reach the registry is worse than no Release: it is a link
      # people follow to something that is not there.
      #
      # The notes come from the annotated tag, so the reasoning is written once
      # and the two cannot drift — but NOT via --notes-from-tag, which passes
      # the message through unchanged.
      #
      # The two formats disagree about newlines. A tag message is hard-wrapped
      # near 76 columns because it is read in a terminal by `git show`, which
      # does not reflow. GitHub renders a release body with hard line breaks
      # PRESERVED, so a single newline becomes a <br> — and a message wrapped
      # for the terminal lands on the releases page as ragged forced breaks at
      # a width the reader never chose. scripts/release-notes.js translates
      # between them, joining prose while leaving lists and code alone.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag object itself, not just the ref it points at — checkout
          # fetches the ref, and %(contents) needs the annotation.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          message="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ -z "$message" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag and carries no message — the release notes come from it"
            exit 1
          fi

          printf '%s\n' "$message" | node scripts/release-notes.js "$GITHUB_REF_NAME" > /tmp/notes.md
          echo "Release notes:"; cat /tmp/notes.md

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file /tmp/notes.md \
            --title "$GITHUB_REF_NAME" \
            --latest

      - name: Summary
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`$name@$version\`"
            echo
            echo "- https://www.npmjs.com/package/$name/v/$version"
            echo "- Provenance is attested to commit \`$GITHUB_SHA\`."
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
